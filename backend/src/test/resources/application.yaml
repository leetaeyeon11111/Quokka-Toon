spring:
  datasource:
    url: jdbc:h2:mem:quokkatoon-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-only-secret-key-that-is-at-least-32-bytes-long
  access-token-validity-seconds: 3600

recommend:
  base-url: http://localhost:8000

webtoon-api:
  base-url: http://localhost:3000

webtoon:
  rating-backfill-enabled: false

oauth:
  kakao:
    rest-key: test
    client-secret: test
  naver:
    client-id: test
    client-secret: test
