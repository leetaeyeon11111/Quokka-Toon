spring:
  # 실제 비밀값(DB 비번, 소셜 시크릿)은 커밋 금지. 아래 secret.properties(로컬, gitignore)에서 로드.
  # 파일이 없으면 무시(optional). 팀원은 secret.properties 를 각자 두거나 환경변수로 주입.
  config:
    import: optional:file:./secret.properties
  application:
    name: quokkatoon
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quokkatoon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:quokka}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate        # schema.sql 로 만든 스키마를 검증만 (JPA가 손대지 않음)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-this-to-a-very-long-random-secret-key-at-least-32-bytes}
  access-token-validity-seconds: 3600        # 1시간

recommend:
  base-url: ${RECOMMEND_URL:http://localhost:8000}

# 소셜 로그인 — 실제 키/시크릿은 secret.properties 또는 환경변수로 주입 (커밋 금지)
oauth:
  kakao:
    rest-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao/callback}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:5173/oauth/naver/callback}
